<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Laundry Services</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="navbar">
    <div class="logo">Logo</div>
    <nav>
      <ul>
        <li><a href="#">Home</a></li>
        <li><a href="#">Services</a></li>
        <li><a href="#">About Us</a></li>
        <li><a href="#">Contact Us</a></li>
      </ul>
    </nav>
    <button class="username">Username</button>
  </header>

  <main class="hero">
    <div class="hero-text">
      <h1>
        Revitalize Your<br />
        Clothes with Expert<br />
        <span>Laundry Services!</span>
      </h1>
      <p>
        From premium dry cleaning to swift wash and fold, we deliver care and
        convenience. Schedule a pickup and rediscover the freshness of your
        clothes today!
      </p>
      <button class="cta">Book a service today!</button>
    </div>

    <div class="hero-image">
      <!-- Orbit wrapper moves the image around a circular path -->
      <div class="orbit">
        <!-- Squeeze wrapper squashes and stretches it -->
        <div class="squeeze">
          <!-- Replace hero.svg with your own washing machine image if you like -->
          <img src="hero.svg" alt="Washing machine with laundry" />
        </div>
      </div>
    </div>
  </main>
</body>
</html>
